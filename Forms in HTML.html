<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML - Level 3</title>
</head>
<body>
    <form action="/server">
        <div>
        <label for="username">Enter Username :</label>
        <input type="text" placeholder="enter username" id="username" name="user">
        </div>
        <div>
            <label for="password">Enter Password :</label>
            <input type="password" placeholder="enter password" id="password" name="pass">
        </div>
        <div>
            <label for="age">Enter Age :</label>
            <input type="number" placeholder="enter age" id="age">
        </div>
        <br>
        <button type="submit">Submit</button>
        <button type="button">Button</button>
        <button type="reset">Reset</button>
        <br>
        
        <input type="submit" value="click me" >
    </form>

    <hr>

    <form action="https://www.youtube.com/results">
        <input type="text" placeholder="Search In Youtube" name="search_query">
        <button>Search</button>
    </form>

    <hr>

        <form action="https://search.brave.com/search">
      <input type="text" placeholder="Search In Brave" name="q">
      <button>Search</button>
    </form>

    <hr>

    <form action="/server">
      <input type="checkbox" id="age" name="age" checked>
      <label for="age">I am 18+</label>
      <button>Submit</button>
    </form>

  <hr>

    <form action="/server">
      <div>
        Choose Your Subjects :
        <input type="checkbox" id="maths" name="subjects" value="maths">
        <label for="maths">Maths</label>
        <input type="checkbox" id="physics" name="subjects" value="physics">
        <label for="physics">Physics</label>
        <input type="checkbox" id="chemistry" name="subjects" value="chemistry">
        <label for="chemistry">Chemistry</label>
        <button>Submit</button>
      </div>
    </form>

    <hr>

    <form action="/server">
      <div>
        Choose Your Favourite Fruit :
        <input type="radio" id="apple" name="fruits" value="apple">
        <label for="apple">Apple</label>
        <input type="radio" id="banana" name="fruits" value="banana">
        <label for="banana">Banana</label>
        <input type="radio" id="orange" name="fruits" value="orange">
        <label for="orange">Orange</label>
        <button>Submit</button>
      </div>
    </form>

    <hr>
    
    <form action="/server">
        <div>
        Choose Your Profession :
        <select name="profession" id="profession"> 
            <option>Select Your Option</option>
            <option value="student">Student</option>
            <option value="developer">Developer</option>
        </select>
        <button>Submit</button>
        </div>
    </form>

    <hr>

    <form action="/server">
        <div>
            <label for="volume">Volume</label>
            <input type="range" min="0" max="100" id="volume" name="volume" step="10">
            <button>Submit</button>
        </div>

        <hr>

        <label for="feedback">Please Provide Your Valuable Feedback :</label>
        <textarea id="feedback" name="feedback" placeholder="Write Your Feedback Here."></textarea>
        <button>Submit</button>
    </form>

        <hr>

            <h2>Practice Question</h2>
    <form action="/action">
                <div>
                    <h3>Registration Form </h3>
                    <input type="text" placeholder="First Name" name="First Name">
                    <input type="text" placeholder="Last Name" name="Last Name">
                </div>
                <div>
                    <lablel for="gender">Please Select Gender :</lablel>
                    <select name="gender" id="gender">
                    <option>Select Your Option</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    </select>
                </div>
                <div>
                    Do you agree to all terms of services?
                    <input type="checkbox" id="service" name="services" checked>
                    <label for="service">Yes I Agree</label>
                </div>
                <button>Register</button>
            </form>
  </body>
</html>
